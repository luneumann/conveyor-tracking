# Synthetic conveyor with ground truth (P1-2) — no camera or MediaPipe model needed.
# Run with --auto-lock: each pass across the image is treated as a new part.
camera:
  type: synthetic
  width: 1280
  height: 720
  fps: 30
  velocity: [250.0, 15.0]   # px/s
  omega: 0.3                # rad/s
  start: [100.0, 300.0, 0.0]
  image_noise: 6.0
  jitter_s: 0.002           # timestamp jitter
  realtime: true
detector:  { type: blob }
tracker:   { coast_ms: 300, reacquire_radius_px: 80, reacquire_growth_px_s: 600 }
predictor: { process_noise: 50.0, measurement_noise: 1.0, horizon_ms: 100 }
transform: { type: identity }
output:    { type: udp, host: 127.0.0.1, port: 5005, rate_hz: 0 }
metrics:   { csv: logs/synthetic.csv }
