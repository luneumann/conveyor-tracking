[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrack"
version = "0.1.0"
description = "Camtrack: camera-based pose tracking for arbitrary objects (virtual encoder, UDP/JSON output)"
requires-python = ">=3.11,<3.13"
dependencies = ["opencv-python>=4.9", "mediapipe==0.10.21", "numpy>=1.26", "pyyaml>=6", "onnxruntime>=1.17"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
ctrack = "ctrack.main:main"
ctrack-gui = "ctrack.gui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ctrack.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
